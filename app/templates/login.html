<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutaxEstimator | Login</title>

    <!--Tailwind CSS-->
    <script src="http://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow border p-8 max-w-sm w-full">

        <!--Page Heading-->
        <h2 class="text-xl font-bold text-gray-700 text-center mb-4"> Bond Portal Login</h2>

        <!--Display flash messages-->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for m in messages %}
        <div class="mb-4 text-xs p-2 rounded bg-red-50 text-red-600">{{ m }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!--Login Form-->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">

            <!--Username-->
            <div>
                <label for="username" class="block text-xs font-bold text-gray-500 mb-1">USERNAME</label>
                <input type="text" id="username" name="username" class="w-full border rounded p-2"
                    autocomplete="username" required>
            </div>

            <!--Password-->
            <div>
                <label for="password" class="block text-xs font-bold text-gray-500 mb-1">PASSWORD</label>
                <input type="password" id="password" name="password" class="w-full border rounded p-2"
                    autocomplete="current-password" required>
            </div>

            <!--Submit Button-->
            <button type="submit" class="w-full bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-700">Log
                In</button>
        </form>

        <!--Registration Link-->
        <p class="text-xs text-center mt- text-gray-400">New User?<a href="{{ url_for('register') }}">Register Bond
                Profile</a></p>
    </div>

</body>

</html>
