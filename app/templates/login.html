<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutaxEstimator | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">
    <main class="auth-card">
        <p class="brand">AutaxEstimator</p>
        <h1 class="page-title">Welcome back</h1>
        <p class="page-intro">Sign in to estimate vehicle import taxes and review your calculation history.</p>

        <!--Display flash messages-->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for m in messages %}
        <div class="flash">{{ m }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!--Login Form-->
        <form method="POST" action="{{ url_for('login') }}" class="form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!--Username-->
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <!--Password-->
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <!--Submit Button-->
            <button type="submit" class="button">Log in</button>
        </form>

        <p class="form-note">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    </main>

</body>

</html>
