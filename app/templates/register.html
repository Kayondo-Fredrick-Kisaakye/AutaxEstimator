<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutaxEstimator | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">
    <main class="auth-card">
        <p class="brand">AutaxEstimator</p>
        <h1 class="page-title">Create your account</h1>
        <p class="page-intro">Set up a profile for your bond or clearing operation.</p>

        <form method="post" action="{{ url_for('register') }}" class="form">

            <!--Bond Industrial Name-->
            <div class="field">
                <label for="bond_name">Bond or company name</label>
                <input type="text" id="bond_name" name="bond_name" required>
            </div>

            <!--Username-->
            <div class="field">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" autocomplete="username" required>
            </div>

            <!--Password-->
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!--Create Account Button-->
            <button type="submit" class="button">Create account</button>

        </form>

        <!--Login Link-->
        <p class="form-note">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </main>
</body>

</html>
